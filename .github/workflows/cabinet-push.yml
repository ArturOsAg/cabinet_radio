# cabinet-push v1 — створено кабінетом «Радіо П.О.Р.Ш.». Не редагуйте вручну: кабінет оновить файл.
name: Cabinet push

on:
  workflow_dispatch:
    inputs:
      id:    { description: 'id повідомлення', required: false, type: string }
      title: { description: 'Заголовок', required: true, type: string }
      body:  { description: 'Текст', required: false, type: string }
      link:  { description: 'Посилання', required: false, type: string }

permissions: {}

concurrency:
  group: cabinet-push-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send push to topic "all"
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          PUSH_ID: ${{ inputs.id }}
          PUSH_TITLE: ${{ inputs.title }}
          PUSH_BODY: ${{ inputs.body }}
          PUSH_LINK: ${{ inputs.link }}
        run: |
          cat > send.mjs <<'JS'
          import crypto from 'node:crypto';
          const raw = process.env.FCM_SERVICE_ACCOUNT || '';
          if (!raw.trim()) { console.error('Немає секрету FCM_SERVICE_ACCOUNT (Settings → Secrets and variables → Actions).'); process.exit(1); }
          let sa;
          try { sa = JSON.parse(raw); } catch { console.error('FCM_SERVICE_ACCOUNT — не JSON. Вставте весь вміст файлу ключа сервісного акаунта.'); process.exit(1); }
          const b64 = (o) => Buffer.from(typeof o === 'string' ? o : JSON.stringify(o)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const tokenUri = sa.token_uri || 'https://oauth2.googleapis.com/token';
          const unsigned = b64({ alg: 'RS256', typ: 'JWT' }) + '.' + b64({
            iss: sa.client_email, aud: tokenUri, iat: now, exp: now + 3600,
            scope: 'https://www.googleapis.com/auth/firebase.messaging',
          });
          const jwt = unsigned + '.' + crypto.createSign('RSA-SHA256').update(unsigned).sign(sa.private_key, 'base64url');
          const tr = await fetch(tokenUri, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: jwt }),
          });
          const tj = await tr.json();
          if (!tr.ok) { console.error('Google не видав токен:', JSON.stringify(tj)); process.exit(1); }

          const title = (process.env.PUSH_TITLE || 'Радіо П.О.Р.Ш.').slice(0, 120);
          const body = (process.env.PUSH_BODY || '').slice(0, 500);
          const message = {
            topic: 'all',
            notification: { title, body },
            data: { id: process.env.PUSH_ID || '', title, body, link: process.env.PUSH_LINK || '' },
            android: { priority: 'high', notification: { sound: 'default' } },
            apns: { payload: { aps: { sound: 'default' } } },
          };
          const r = await fetch('https://fcm.googleapis.com/v1/projects/' + sa.project_id + '/messages:send', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + tj.access_token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message }),
          });
          const t = await r.text();
          if (!r.ok) { console.error('FCM відхилив повідомлення:', r.status, t); process.exit(1); }
          console.log('Push надіслано:', t);
          JS
          node send.mjs
